<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pac-Man Level 2</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-wrapper">
    <canvas id="gameCanvas" width="840" height="600"></canvas>

    <aside class="side-panel">
      <div class="panel-hud">
        <div><span>Score</span><span id="scoreDisplay">0</span></div>
        <div><span>Lives</span><span id="livesDisplay">3</span></div>
      </div>
      <hr class="panel-divider">

      <h2>Controls</h2>
      <ul>
        <li><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> – Move Pac-Man</li>
        <li><kbd>P</kbd> – Pause / Resume</li>
        <li><kbd>H</kbd> – Go to Home (while paused)</li>
        <li><kbd>Space</kbd> – Continue after you die</li>
        <li><kbd>R</kbd> – Restart after Game Over / Win</li>
      </ul>

      <h3>Goal</h3>
      <p>
        Level 2 adds more ghost pressure. Clear all pellets to see the next
        COVID-19 info section and unlock Level 3.
      </p>
    </aside>
  </div>

  <img id="memeOverlay" style="display:none;">

  <script src="level-config/level2.js"></script>
  <script src="game.js"></script>
</body>
</html>
